name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        run: |
          npm install

      - name: Build package
        run: |
          npm run vscode:package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          if-no-files-found: error
          path: |
            *.vsix
